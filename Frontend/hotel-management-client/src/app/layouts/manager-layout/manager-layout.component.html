<div class="manager-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">🏨</div>
            <h2>Manager Portal</h2>
            @if (currentUser()) {
            <p class="user-name">{{ currentUser()?.fullName }}</p>
            <span class="role-badge">{{ currentUser()?.role }}</span>
            }
        </div>

        <nav class="sidebar-nav">
            <a routerLink="/manager/dashboard" routerLinkActive="active" class="nav-link">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a routerLink="/manager/users" routerLinkActive="active" class="nav-link">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Users</span>
            </a>
            <a routerLink="/manager/rooms" routerLinkActive="active" class="nav-link">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Rooms</span>
            </a>
            <a routerLink="/manager/room-types" routerLinkActive="active" class="nav-link">
                <span class="nav-icon">🛏️</span>
                <span class="nav-label">Room Types</span>
            </a>
            <a routerLink="/manager/reports" routerLinkActive="active" class="nav-link">
                <span class="nav-icon">📈</span>
                <span class="nav-label">Reports</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button (click)="logout()" class="logout-btn">
                <span class="nav-icon">🚪</span>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <h1>Hotel Management System</h1>
            <div class="user-menu">
                @if (currentUser()) {
                <span class="username">{{ currentUser()?.username }}</span>
                }
            </div>
        </header>

        <!-- Page Content -->
        <div class="content-area">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>

<!-- Toast notifications -->
<app-toast-container></app-toast-container>
